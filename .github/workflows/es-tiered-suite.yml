name: ES Teacher Web - Sanity / Smoke / Regression

# The same three tiers as tiered-suite.yml, against the ES Teacher (Gujarat) web
# portal with the ES account and the Gujarat backend. Manual only for now: the
# Flutter ES portal is not released yet (esteacher.englishgurukul.in still serves
# the old build, so the reachability step below fails with a clear message).
# When the build is shared: Actions -> this workflow -> Run workflow, with
# base_url pointing at the shared build if it is not on the live host yet.
#
# Once ES web is live, add a schedule here (e.g. cron "45 3 * * *", 09:15 IST).
on:
  workflow_dispatch:
    inputs:
      run_all_tiers:
        description: "Run smoke and regression even if an earlier tier failed"
        type: boolean
        default: false
      regression_markers:
        description: "pytest -m expression for the regression tier"
        required: false
        default: "not heavy"
      base_url:
        description: "ES Teacher web portal under test"
        required: false
        default: "https://esteacher.englishgurukul.in/"

env:
  BASE_URL: ${{ inputs.base_url || 'https://esteacher.englishgurukul.in/' }}
  # ES account on the Gujarat backend (EsTeacherApp in the remote config).
  SCHOOL_SEARCH: "24071203646"
  SCHOOL_NAME: "24071203646-INDIRANAGAR PUBLIC SCHOOL"
  TEACHER_MOBILE: "6326326326"
  API_CONFIG_APP: EsTeacherApp
  API_PROD_URL: https://eg-360-gujarat-api-yaejwhx6ca-el.a.run.app
  REPORT_TITLE: ES Teacher Web QA
  BROWSER: chrome
  HEADLESS: "true"
  WINDOW_WIDTH: "1440"
  WINDOW_HEIGHT: "900"
  DEFAULT_TIMEOUT: "30"
  APP_LOAD_TIMEOUT: "90"
  DATA_LOAD_TIMEOUT: "60"
  REGRESSION_MARKERS: ${{ inputs.regression_markers || 'not heavy' }}
  RUN_ALL: ${{ inputs.run_all_tiers || 'false' }}

jobs:
  tiers:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show browser under test
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          fi
          google-chrome --version

      - name: Check the portal is reachable
        run: |
          echo "Site under test: $BASE_URL"
          curl --silent --show-error --fail --location \
               --retry 5 --retry-delay 10 --retry-all-errors \
               --max-time 60 --output /dev/null --write-out 'HTTP %{http_code} in %{time_total}s\n' \
               "$BASE_URL"
          # The Flutter portal publishes version.json; the old ES build does not.
          curl --silent --fail "${BASE_URL}version.json" && echo || {
            echo "::error::$BASE_URL is not the Flutter ES Teacher portal yet (no version.json) - run this once the ES web build is deployed."
            exit 1
          }

      # -- tier 1: sanity --------------------------------------------------------
      - name: Sanity
        id: sanity
        continue-on-error: true
        run: python -m pytest -m sanity --reruns 1 --reruns-delay 5 --junitxml=reports/junit_sanity.xml

      # -- tier 2: smoke (only if sanity passed, unless run_all_tiers) -----------
      - name: Smoke
        id: smoke
        if: steps.sanity.outcome == 'success' || env.RUN_ALL == 'true'
        continue-on-error: true
        run: python -m pytest -m smoke --reruns 1 --reruns-delay 5 --junitxml=reports/junit_smoke.xml

      # -- tier 3: regression (only if smoke passed, unless run_all_tiers) -------
      - name: Regression
        id: regression
        if: steps.smoke.outcome == 'success' || env.RUN_ALL == 'true'
        continue-on-error: true
        run: python -m pytest -m "$REGRESSION_MARKERS" --reruns 1 --reruns-delay 5 --junitxml=reports/junit_regression.xml

      - name: Post tiered summary to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m utils.tier_summary \
            sanity=reports/junit_sanity.xml \
            smoke=reports/junit_smoke.xml \
            regression=reports/junit_regression.xml || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es-web-tiered-reports
          path: reports/
          retention-days: 14

      - name: Fail the job if any tier failed or was skipped
        if: always()
        run: |
          for t in sanity smoke regression; do
            [ -f "reports/junit_$t.xml" ] || { echo "$t did not run"; exit 1; }
          done
          python -m utils.tier_summary --dry-run \
            sanity=reports/junit_sanity.xml smoke=reports/junit_smoke.xml \
            regression=reports/junit_regression.xml > /dev/null
