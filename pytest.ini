[pytest]
addopts = -v -ra --strict-markers --html=reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: fast happy-path checks that must always pass
    regression: full regression coverage
    login: login / authentication flows
    navigation: nav bar, dashboard boxes and drawer navigation
    lessons: lesson-plan flows
    reports: class and student report flows
    management: student management flows
    profile: profile and settings flows
    web: behaviour specific to the web portal (theme toggle, deep links, resize)
    heavy: long-running exhaustive sweeps (opt in explicitly)
